<script>
(function(){
  const live=location.protocol==='https:'&&['alicepiano-komatsu.com','www.alicepiano-komatsu.com'].includes(location.hostname);
  if(!live)return;
  let stamp=0;
  try{stamp=Number(sessionStorage.getItem('alice_contact_pending_v2')||'0');sessionStorage.removeItem('alice_contact_pending_v2');}catch(_){}
  let fromService=false;try{fromService=new URL(document.referrer).hostname==='formsubmit.co';}catch(_){}
  // Count a service return, not inbox delivery. Missing referrer intentionally undercounts.
  const validReturn=fromService&&stamp>0&&Date.now()-stamp>=0&&Date.now()-stamp<60*60*1000;
  if(validReturn){
    document.getElementById('return-title').textContent='お問い合わせありがとうございます';
    document.getElementById('return-message').textContent='フォームの送信手続きが完了しました。内容を確認して、教室よりご返信いたします。';
  }
  window.dataLayer=window.dataLayer||[];window.gtag=window.gtag||function(){dataLayer.push(arguments)};
  window.gtag('js',new Date());window.gtag('config','G-1B9Q314H3W');
  if(validReturn)window.gtag('event','contact_form_return',{send_to:'G-1B9Q314H3W',form_id:'contactForm',page_location:'https://alicepiano-komatsu.com/contact-complete.html',transport_type:'beacon'});
  const s=document.createElement('script');s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id=G-1B9Q314H3W';document.head.appendChild(s);
})();
