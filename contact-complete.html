<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>お問い合わせありがとうございます｜アリスピアノ教室</title>
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#fffafd">
<link rel="icon" href="https://alicepiano-komatsu.com/favicon-v2.ico?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box} body{margin:0;background:#fffafd;color:#342a2f;font-family:'Noto Sans JP',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.8}
.wrap{min-height:100svh;display:grid;place-items:center;padding:40px 20px}
.card{width:min(680px,100%);background:#fff;border:1px solid #ecd8e0;border-radius:28px;padding:clamp(28px,6vw,52px);box-shadow:0 18px 44px rgba(92,51,69,.075);text-align:center}
.logo{width:min(220px,60vw);height:auto;margin:0 auto 28px}.eyebrow{color:#b6547c;font-size:.75rem;letter-spacing:.16em;font-weight:700}.title{font-family:'Noto Serif JP',serif;font-size:clamp(1.7rem,5vw,2.5rem);line-height:1.5;margin:.45rem 0 1rem}.lead{color:#6b5b62;margin:0 auto 1.5rem;max-width:34em}.note{background:#fff5f8;border:1px solid #ecd8e0;border-radius:16px;padding:16px;text-align:left;color:#65555e;font-size:.92rem;margin:24px 0}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:.8rem 1.35rem;border-radius:999px;text-decoration:none;font-weight:700}.primary{background:#b6537a;color:#fff}.secondary{border:1px solid #e3cfd7;color:#57454d;background:#fff}@media(max-width:560px){.actions{display:grid}.btn{width:100%}}
</style>
<script>
(function(){
  const production=location.protocol==='https:'&&['alicepiano-komatsu.com','www.alicepiano-komatsu.com'].includes(location.hostname);
  if(!production)return;
  window.dataLayer=window.dataLayer||[];
  window.gtag=window.gtag||function(){window.dataLayer.push(arguments)};
  window.gtag('js',new Date());
  window.gtag('config','G-1B9Q314H3W');
  const s=document.createElement('script');s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id=G-1B9Q314H3W';document.head.appendChild(s);
  try{
    const raw=sessionStorage.getItem('alice_contact_pending_v2');
    const ts=Number(raw||0);
    const recent=ts>0&&(Date.now()-ts)<30*60*1000;
    if(recent){
      window.gtag('event','contact_form_submit',{send_to:'G-1B9Q314H3W',page_type:'contact_complete',form_id:'contactForm',form_channel:'formsubmit',transport_type:'beacon'});
      sessionStorage.removeItem('alice_contact_pending_v2');
    }
  }catch(_){ }
})();
</script>
</head>
<body>
<main class="wrap">
<section class="card" aria-labelledby="complete-title">
<a href="https://alicepiano-komatsu.com/" aria-label="アリスピアノ教室トップへ"><img class="logo" src="https://alicepiano-komatsu.com/logo2.png" alt="アリスピアノ教室 ロゴ" decoding="async"></a>
<div class="eyebrow">THANK YOU</div>
<h1 class="title" id="complete-title">お問い合わせありがとうございます</h1>
<p class="lead">送信を受け付けました。内容を確認のうえ、ご入力いただいたメールアドレスへ返信いたします。</p>
<div class="note">2日以内に返信がない場合は、迷惑メールフォルダをご確認ください。届いていない場合は、LINEまたはお電話でお知らせください。</div>
<div class="actions">
<a class="btn primary" href="https://lin.ee/s7dxB4M" rel="noopener">LINEで連絡する</a>
<a class="btn secondary" href="https://alicepiano-komatsu.com/">トップページへ戻る</a>
</div>
</section>
</main>
</body>
</html>
